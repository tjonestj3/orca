name: Orca Jarvis iOS

# Kept at the Duo beta's path: GitHub already has that workflow registered on this fork, and a new path
# never registered after the large first push of this branch.

# Personal build of Orca mobile with the Jarvis voice screen: builds jarvis-voice under our own App ID
# and uploads it to TestFlight for internal testing. Mirrors mobile-ios-release.yml's ios-build job
# without the external-tester distribution.
on:
  push:
    branches:
      - jarvis-voice
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ios
  cancel-in-progress: true

jobs:
  ios-build:
    # Xcode 27.1's iOS 27.1 SDK is what lets the app resize on iPhone Duo instead of letterboxing.
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      BUNDLE_FROZEN: 'true'
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER || 'com.krahnborn.orca.duo' }}
      ORCA_IOS_APP_NAME: 'Xeno'
      ORCA_IOS_ICON: './assets/icon-jarvis.png'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'

    defaults:
      run:
        working-directory: mobile

    steps:
      # Fail in seconds, not after a 30-minute archive, when signing has not been set up yet.
      - name: Check signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        working-directory: .
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8 APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see JARVIS_BUILD.md)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      # React Native builds from source here (its patches), most of the archive's time: ccache keeps last build's
      # compiled files, so a build recompiles only what changed. React Native's ccache-clang wrapper is set as the
      # Pods' compiler by pod install when ccache is on PATH (app.json: ccacheEnabled).
      - name: Install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          command -v ccache >/dev/null || brew install ccache
          {
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # Each build saves its own; the next one starts from the latest.
          key: ccache-ios-xcode27-${{ github.run_id }}
          restore-keys: ccache-ios-xcode27-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Resolve release version and build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: bundle exec fastlane ios prepare_release_version

      - name: Expo prebuild
        env:
          ORCA_IOS_APS_ENVIRONMENT: production
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: bundle exec pod install

      # React Native's ccache wrappers start ccache from $CCACHE_BINARY, a build setting Xcode doesn't hand the
      # compiler, so they ran plain clang: write them with this runner's ccache and cache settings in place.
      - name: Point React Native's ccache wrappers at ccache
        run: |
          set -euo pipefail
          dir="$(node -p "require('path').dirname(require.resolve('react-native/package.json'))")/scripts/xcode"
          ccache="$(command -v ccache)"
          for pair in "ccache-clang.sh:clang" "ccache-clang++.sh:clang++"; do
            file="$dir/${pair%%:*}"
            rm -f "$file"
            {
              echo '#!/bin/sh'
              echo "export CCACHE_CONFIGPATH='$dir/ccache.conf'"
              echo "export CCACHE_DIR='$CCACHE_DIR' CCACHE_BASEDIR='$CCACHE_BASEDIR' CCACHE_MAXSIZE='$CCACHE_MAXSIZE'"
              echo "exec '$ccache' ${pair##*:} \"\$@\""
            } > "$file"
            chmod +x "$file"
            cat "$file"
          done

      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/orca-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/orca-dist-cert.p12"

          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      # Uploads only; an internal TestFlight group with automatic distribution picks the build up.
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ccache --zero-stats
          bundle exec fastlane ios build_and_upload

      # Whether Xcode compiled through React Native's ccache wrapper, and where any cache went.
      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats -v || true
          for d in "$HOME/Library/Caches/ccache" "$HOME/.ccache" "$HOME/.cache/ccache"; do
            if [ -d "$d" ]; then du -sh "$d"; fi
          done
          log="$(ls -t "$HOME"/Library/Logs/gym/*.log 2>/dev/null | head -1)"
          if [ -n "$log" ]; then
            echo "compiles through the ccache wrapper: $(grep -c 'ccache-clang' "$log" || true)"
            echo "clang compiles: $(grep -cE '^\s*(CompileC|SwiftCompile) ' "$log" || true)"
            grep -m1 -E 'ccache-clang|bin/clang ' "$log" | cut -c1-300 || true
          fi
